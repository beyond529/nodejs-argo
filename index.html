<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS | 未来科技视界</title>
    <!-- 引入科技感字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto+Mono:wght@300;400&display=swap" rel="stylesheet">
    
    <style>
        /* --- CSS 变量定义 --- */
        :root {
            --bg-color: #050a10;
            --primary-color: #00f3ff; /* 青色霓虹 */
            --secondary-color: #bc13fe; /* 紫色霓虹 */
            --text-color: #e0e6ed;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --font-display: 'Orbitron', sans-serif;
            --font-body: 'Roboto Mono', monospace;
        }

        /* --- 全局重置 --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-body);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* --- 背景 Canvas --- */
        #canvas-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.6;
        }

        /* --- 导航栏 --- */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
            position: fixed;
            width: 100%;
            z-index: 100;
        }

        .logo {
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
            letter-spacing: 2px;
        }

        .nav-links a {
            color: var(--text-color);
            text-decoration: none;
            margin-left: 30px;
            font-size: 0.9rem;
            transition: 0.3s;
            position: relative;
        }

        .nav-links a:hover {
            color: var(--primary-color);
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--primary-color);
            transition: 0.3s;
            box-shadow: 0 0 8px var(--primary-color);
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        /* --- Hero 区域 --- */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
        }

        .hero h1 {
            font-family: var(--font-display);
            font-size: 4rem;
            margin-bottom: 20px;
            background: linear-gradient(90deg, var(--primary-color), #fff, var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: glow 3s infinite alternate;
        }

        .hero p {
            font-size: 1.2rem;
            max-width: 600px;
            margin-bottom: 40px;
            color: #a0aab5;
        }

        .btn {
            padding: 12px 30px;
            background: transparent;
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            font-family: var(--font-display);
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            background: var(--primary-color);
            color: #000;
            box-shadow: 0 0 20px var(--primary-color);
        }

        /* --- 特性卡片区 --- */
        .features {
            padding: 100px 50px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 40px;
            border-radius: 10px;
            backdrop-filter: blur(5px);
            transition: 0.4s;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-10px);
            border-color: var(--secondary-color);
            box-shadow: 0 10px 30px rgba(188, 19, 254, 0.1);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 3px;
            height: 0;
            background: var(--secondary-color);
            transition: 0.4s;
        }

        .card:hover::before {
            height: 100%;
        }

        .card-icon {
            font-size: 2rem;
            color: var(--secondary-color);
            margin-bottom: 20px;
        }

        .card h3 {
            font-family: var(--font-display);
            margin-bottom: 15px;
            color: #fff;
        }

        /* --- 页脚 --- */
        footer {
            text-align: center;
            padding: 40px;
            border-top: 1px solid var(--glass-border);
            font-size: 0.8rem;
            color: #666;
        }

        /* --- 动画 --- */
        @keyframes glow {
            from { text-shadow: 0 0 10px rgba(0, 243, 255, 0.2); }
            to { text-shadow: 0 0 20px rgba(0, 243, 255, 0.6), 0 0 10px rgba(188, 19, 254, 0.4); }
        }

        /* --- 移动端适配 --- */
        @media (max-width: 768px) {
            .hero h1 { font-size: 2.5rem; }
            nav { padding: 20px; }
            .nav-links { display: none; } /* 简化版隐藏菜单 */
        }
    </style>
</head>
<body>

    <!-- 动态背景 -->
    <canvas id="canvas-bg"></canvas>

    <!-- 导航栏 -->
    <nav>
        <div class="logo">NEXUS_</div>
        <div class="nav-links">
            <a href="#">首页</a>
            <a href="#">解决方案</a>
            <a href="#">核心技术</a>
            <a href="#">关于我们</a>
        </div>
    </nav>

    <!-- 主要内容区 -->
    <section class="hero">
        <h1>FUTURE VISION</h1>
        <p>探索数字边界，连接无限可能。我们致力于构建下一代人工智能与量子计算融合的生态系统。</p>
        <button class="btn">启动系统</button>
    </section>

    <!-- 特性展示 -->
    <section class="features">
        <div class="card">
            <div class="card-icon">⚡</div>
            <h3>量子加速</h3>
            <p>利用最新的量子算法，将数据处理速度提升至传统超算的指数级倍数，解决复杂模拟问题。</p>
        </div>
        <div class="card">
            <div class="card-icon">🧠</div>
            <h3>神经拟态</h3>
            <p>模仿人脑突触结构的芯片架构，实现超低功耗的边缘计算与实时深度学习推理。</p>
        </div>
        <div class="card">
            <div class="card-icon">🛡️</div>
            <h3>零信任安全</h3>
            <p>基于区块链的去中心化身份验证，结合生物特征加密，确保数据资产的绝对安全。</p>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 NEXUS TECHNOLOGIES. ALL RIGHTS RESERVED. <br> SYSTEM STATUS: ONLINE</p>
    </footer>

    <!-- JavaScript 粒子特效 -->
    <script>
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let particles = [];
        
        // 设置画布尺寸
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        
        window.addEventListener('resize', resize);
        resize();

        // 粒子类
        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.5; // 速度
                this.vy = (Math.random() - 0.5) * 0.5;
                this.size = Math.random() * 2;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                // 边界反弹
                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;
            }

            draw() {
                ctx.fillStyle = 'rgba(0, 243, 255, 0.5)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // 初始化粒子
        function init() {
            particles = [];
            const particleCount = window.innerWidth < 768 ? 50 : 100; // 移动端减少粒子数
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        // 动画循环
        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();

                // 绘制连线
                for (let j = i; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < 150) {
                        ctx.strokeStyle = `rgba(0, 243, 255, ${1 - distance / 150})`;
                        ctx.lineWidth = 0.5;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animate);
        }

        init();
        animate();
    </script>
</body>
</html>
